# Cloudflare Worker that mirrors the Telegram Bot API and t.me/s/ for servers in Russia.
# Dashboard deploys do not need this file. For CLI deploys: cd docker && npx wrangler deploy
# `name` must match the worker created in the dashboard, otherwise a second worker is created.
name = "yellow-sea-7d43"
main = "telegram-proxy-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Digits before ":" in each bot token, comma-separated: Freelance OS bot and the demo bot.
ALLOWED_BOT_ID = "8647410673,7833399451"
