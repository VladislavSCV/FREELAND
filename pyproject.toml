[project]
name = "freelance-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.4,<3", "httpx>=0.27,<1", "aiogram>=3.13,<4", "redis>=5,<7", "typer>=0.12,<1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[project.scripts]
freelance = "app.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
